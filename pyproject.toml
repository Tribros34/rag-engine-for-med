[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anatomy-knowledge-service"
version = "0.1.0"
description = "Yapı-bağlamlı anatomi soru-cevap servisi (RAG) — 3D/AR anatomi atlası için"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "obonet>=1.3.0",
    "networkx>=3.6.1",
    "rapidfuzz>=3.14.6",
    "beautifulsoup4>=4.15.0",
    "markdown-it-py>=4.2.0",
    "PyYAML>=6.0.3",
    "httpx>=0.28.1",
    "anthropic>=1.13.0",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=6.1.0", "torch>=2.14.1"]
demo = ["streamlit>=1.65.0", "requests>=2.34.2"]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "mypy>=2.4.0",
    "types-PyYAML",
    "types-requests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
