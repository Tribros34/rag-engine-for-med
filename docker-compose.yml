services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports: ["6333:6333"]
    volumes: ["./data/qdrant:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_DEVICE: cpu
    command: uvicorn anatomy_ks.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - hf-cache:/hf-cache   # embedding modeli bir kez iner
    depends_on:
      qdrant: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/health"]
      interval: 10s
      start_period: 120s
      retries: 30

  demo:
    build: .
    command: streamlit run demo/app.py --server.port 8501 --server.address 0.0.0.0
    environment: ["API_URL=http://api:8000"]
    ports: ["8501:8501"]
    depends_on:
      api: {condition: service_healthy}

  # Tek seferlik indeksleme: docker compose --profile ingest run --rm ingest
  ingest:
    build: .
    profiles: ["ingest"]
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_DEVICE: cpu
    command: python scripts/ingest_all.py
    volumes:
      - ./data:/app/data
      - hf-cache:/hf-cache
    depends_on:
      qdrant: {condition: service_healthy}

volumes:
  hf-cache:
